name: CI

on: [push, pull_request]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Animation JavaScript budget (bin/budget.json).
      - run: npm run check:budget
      # Generated token files must be committed in sync with tokens.json.
      - run: git diff --exit-code -- web/wp-content/themes/chargenet/theme.json web/wp-content/themes/chargenet/assets/src/scss/_tokens.generated.scss web/wp-content/themes/chargenet/assets/src/scss/_breakpoints.generated.scss
