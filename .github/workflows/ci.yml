name: CI

on: [push, pull_request]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Animation JavaScript budget (bin/budget.json).
      - run: npm run check:budget
      # Generated token files must be committed in sync with tokens.json.
      - run: git diff --exit-code -- web/wp-content/themes/chargenet/theme.json web/wp-content/themes/chargenet/assets/src/scss/_tokens.generated.scss web/wp-content/themes/chargenet/assets/src/scss/_breakpoints.generated.scss

  seo:
    # Starts the site with DDEV and crawls it: bin/check-seo.mjs, hreflang and redirects (docs/seo.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: ddev/github-action-setup-ddev@v1
      - run: ddev start
      # The site redirects to https with DDEV's local certificate: let Node trust its CA.
      - run: echo "NODE_EXTRA_CA_CERTS=$(mkcert -CAROOT)/rootCA.pem" >> "$GITHUB_ENV"
      - run: npm run check:seo -- http://chargenet.ddev.site --production
      - run: npm run perf -- --check --out perf-result.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: perf-result
          path: perf-result.json
          if-no-files-found: ignore
      - run: npm run check:hreflang
      - run: npm run check:redirects
      - run: npm run check:security
      - run: npm run check:a11y
      - run: npm run test:redirect-rules
      # Firefox cannot run on the developer's Mac (macOS too new for the bundled build), so it is tested here.
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --grep-invert "visual " --project=chromium-desktop --project=firefox-desktop --project=firefox-mobile --project=webkit-mobile
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
